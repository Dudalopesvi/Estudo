<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saep Saúde</title>
  </head>
  <body>
    <div class="container">
      <!-- ASIDE DO PERFIL -->
      <aside class="perfil">
        <!-- PERFIL TOPO -->
        <div class="perfil-topo">
          <img src="" alt="" class="perfil-logo" />
          <h2 class="perfil-nome">SAEP Saúde</h2>
        </div>
        <!-- PERFIL TOPO -->
        <!-- PERFIL TOTAIS -->
        <div class="perfil-totais">
          <div>
            <span>0</span>
            <p>Qtd. Atividades</p>
          </div>
          <div>
            <span>0</span>
            Qtd. Calorias
          </div>
        </div>
        <!-- PERFIL TOTAIS -->
        <button disabled>Criar Atividade</button>
        <div class="redes">
          <img src="icones/instagram.svg" alt="" />
          <img src="icones/twitter.svg" alt="" />
          <img src="icones/tiktok.svg" alt="" />
        </div>
      </aside>
      <!-- ASIDE DO PERFIL -->

      <!-- MAIN -->
      <main class="main">
        <header class="main-header">
          <button id="btn-login">Login</button>
          <button>Logout</button>
        </header>

        <div class="filtros">
          <button class="filtro">Corrida</button>
          <button class="filtro">Caminhada</button>
          <button class="filtro">Trilha</button>
        </div>

        <div class="lista-atividades">Atividade</div>

        <div class="paginacao">
          <button>antes</button>
          <button>1</button>
          <button>2</button>
          <button>depois</button>
        </div>
      </main>
      <!-- MAIN -->

      <!-- MODAL LOGIN -->
      <div class="modal">
        <div class="modal-conteudo">
          <div class="modal-topo">
            <h3>Login</h3>
            <img src="icones/x.svg" alt="Fechar" />
          </div>
          <label>Email</label>
          <input type="text" name="" id="input-email" />
          <label for="">Senha</label>
          <input type="password" id="input-senha" />
          <p id="erro-login">Erro de Login</p>
          <div class="modal-botoes">
            <button id="btn-cancelar">Cancelar</button>
            <button id="btn-confirmar-login">Login</button>
          </div>
        </div>
      </div>
      <!-- MODAL LOGIN -->
    </div>
  </body>
</html>
