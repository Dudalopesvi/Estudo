<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atividades</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="layout">
        <!-- COLUNA 1 — PERFIL -->
        <aside class="perfil">
            <div class="perfil-topo">
                <div class="perfil-identidade" id="companyBrand">
                    <img src="./assets/logo-placeholder.svg" alt="Logo Empresa" class="perfil-logo" id="companyLogo">
                    <h2 class="perfil-nome" id="companyName">Empresa Fitness</h2>
                </div>

                <!-- Bloco do Usuário com Foto de Perfil -->
                <div class="perfil-usuario-box">
                    <img src="./assets/img.jpg" alt="Foto do Usuário" class="perfil-avatar" id="profileAvatar">
                    <h3 class="perfil-usuario-nome" id="profileName">Visitante</h3>
                </div>

                <div class="perfil-totais">
                    <div class="total-item">
                        <span class="total-valor" id="profileStatsVal">0</span>
                        <span class="total-label">kcal totais</span>
                    </div>
                </div>

                <button class="btn-atividades" id="btnMinhasAtividades" disabled>
          Minhas Atividades
        </button>
            </div>

            <!-- Rodapé com Redes Sociais da pasta /icons -->
            <footer class="perfil-rodape">
                <span class="rodape-nome" id="footerCompanyName">Empresa Fitness</span>
                <div class="rodape-redes">
                    <a href="#" target="_blank" aria-label="Instagram">
                        <img src="./assets/icons/instagram.svg" alt="Instagram">
                    </a>
                    <a href="#" target="_blank" aria-label="TikTok">
                        <img src="./assets/icons/tiktok.svg" alt="TikTok">
                    </a>
                    <a href="#" target="_blank" aria-label="Twitter">
                        <img src="./assets/icons/twitter.svg" alt="Twitter">
                    </a>
                </div>
                <span class="rodape-copyright">&copy; 2026 Todos os direitos reservados.</span>
            </footer>
        </aside>

        <!-- COLUNA 2 — MAIN -->
        <main class="main">
            <header class="main-header">
                <button class="btn-login" id="btnAuth">Login</button>
            </header>

            <!-- FILTROS -->
            <nav class="filtros">
                <button class="filtro-item ativo" data-tipo="todos">Todos</button>
                <button class="filtro-item" data-tipo="Corrida">Corrida</button>
                <button class="filtro-item" data-tipo="Caminhada">Caminhada</button>
                <button class="filtro-item" data-tipo="Trilha">Trilha</button>
            </nav>

            <!-- LISTAGEM DE ATIVIDADES -->
            <section class="listagem" id="activitiesContainer">
                <!-- Cards renderizados via JS -->
            </section>

            <!-- PAGINAÇÃO -->
            <footer class="paginacao" id="paginationContainer">
                <!-- Botões renderizados via JS -->
            </footer>
        </main>
    </div>

    <!-- MODAL DE LOGIN -->
    <div class="modal-overlay hidden" id="loginModal">
        <div class="modal-caixa">
            <button class="modal-fechar" id="btnCloseModal">&times;</button>
            <h2 class="modal-titulo">Login</h2>

            <form class="modal-form" id="loginForm" novalidate>
                <label for="emailInput">E-mail</label>
                <input type="email" id="emailInput" placeholder="Seu e-mail">

                <label for="senhaInput">Senha</label>
                <input type="password" id="senhaInput" placeholder="Sua senha">
                <div class="modal-erro hidden" id="loginError"></div>

                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar" id="btnCancelarLogin">Cancelar</button>
                    <button type="submit" class="btn-entrar">Login</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>

</html>
